<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>陈瑜卿学习乐园</title>
<meta name="theme-color" content="#FF7FA9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学习乐园">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="unicorn-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="unicorn-192.png">
<style>
:root{
  --pink:#FF7FA9; --pink-l:#FFE0EC;
  --blue:#4FB8FF; --blue-l:#D6EEFF;
  --yellow:#FFC83C; --yellow-l:#FFF1BE;
  --green:#4FD38A; --green-l:#D2F6E2;
  --purple:#A98BF5; --purple-l:#E9E0FF;
  --cream:#FFF6FB;
  --ink:#5A4A5E;
  --card:#FFFFFF;
  --shadow:0 6px 18px rgba(180,140,200,.18);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#FFF6FB 0%,#F1F7FF 50%,#F6F0FF 100%);
  color:var(--ink);
  font-size:16px;
  -webkit-text-size-adjust:100%;
}
#app{display:flex;min-height:100vh;}
/* ---------- Sidebar (PC) ---------- */
#sidebar{
  width:210px;flex:0 0 210px;
  background:linear-gradient(180deg,#FFE7F2,#E9E0FF);
  padding:18px 12px;display:flex;flex-direction:column;gap:6px;
  box-shadow:4px 0 16px rgba(180,140,200,.12);
}
.brand{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;font-weight:800;font-size:18px;color:#7A4E86;}
.brand svg{width:34px;height:34px;flex:0 0 34px;}
.navbtn{
  display:flex;align-items:center;gap:10px;
  border:none;background:transparent;cursor:pointer;
  padding:12px 12px;border-radius:16px;font-size:16px;font-weight:700;color:#6E5678;
  min-height:50px;transition:.15s;text-align:left;width:100%;
}
.navbtn svg{width:26px;height:26px;flex:0 0 26px;}
.navbtn:active{transform:scale(.97);}
.navbtn.active{background:#fff;color:#E0568F;box-shadow:var(--shadow);}
.navbtn .star{margin-left:auto;background:var(--yellow);color:#7a5a00;font-size:13px;font-weight:800;padding:2px 8px;border-radius:10px;}
/* ---------- Content ---------- */
#content{flex:1;padding:18px 22px 40px;max-width:1100px;margin:0 auto;width:100%;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.topbar h1{font-size:24px;margin:0;color:#7A4E86;}
.pill{background:#fff;border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;}
.pill svg{width:20px;height:20px;}
.module-title{font-size:22px;font-weight:800;color:#7A4E86;margin:6px 0 14px;display:flex;align-items:center;gap:8px;}
.module-title svg{width:28px;height:28px;}
/* cards grid */
.grid{display:grid;gap:14px;}
.grid.c2{grid-template-columns:repeat(2,1fr);}
.grid.c3{grid-template-columns:repeat(3,1fr);}
.grid.c4{grid-template-columns:repeat(4,1fr);}
.grid.c5{grid-template-columns:repeat(5,1fr);}
.grid.c6{grid-template-columns:repeat(6,1fr);}
.grid.c7{grid-template-columns:repeat(7,1fr);}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);}
/* pinyin / letter card */
.lc{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 6px;cursor:pointer;transition:.15s;border:3px solid transparent;min-height:108px;position:relative;
}
.lc:active{transform:scale(.95);}
.lc .big{font-size:38px;font-weight:900;line-height:1;}
.lc .sm{font-size:15px;margin-top:6px;color:#8a7a90;font-weight:700;}
.lc .acts{display:flex;gap:6px;margin-top:8px;}
.lc .acts button{
  border:none;background:var(--pink-l);color:#d6447f;border-radius:12px;
  width:42px;height:42px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.lc .acts button.b2{background:var(--blue-l);color:#2f8fd6;}
.lc.pink{border-color:var(--pink-l);} .lc.blue{border-color:var(--blue-l);}
.lc.yellow{border-color:var(--yellow-l);} .lc.green{border-color:var(--green-l);}
.lc.purple{border-color:var(--purple-l);}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tab{
  border:none;background:#fff;color:#7A4E86;font-weight:800;
  padding:10px 16px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow);font-size:15px;min-height:44px;
}
.tab.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;}
/* game area */
.game{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);text-align:center;}
.qprompt{font-size:20px;font-weight:800;color:#7A4E86;margin-bottom:14px;}
.seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.seq .slot{width:62px;height:62px;background:var(--cream);border-radius:16px;display:flex;align-items:center;justify-content:center;}
.seq .slot svg{width:46px;height:46px;}
.seq .qm{font-size:40px;font-weight:900;color:var(--purple);}
.opt{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-top:12px;}
.opt button{
  border:none;background:var(--cream);border-radius:18px;padding:14px;cursor:pointer;
  font-size:30px;font-weight:900;color:#7A4E86;min-height:64px;display:flex;align-items:center;justify-content:center;transition:.12s;
}
.opt button:active{transform:scale(.94);background:var(--yellow-l);}
.opt button svg{width:50px;height:50px;}
.opt button.correct{background:var(--green-l);color:#1d8a52;}
.opt button.wrong{background:#FFE0E0;color:#d63b3b;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* big action button */
.btn{
  border:none;cursor:pointer;font-weight:800;font-size:18px;border-radius:18px;
  padding:14px 22px;min-height:50px;box-shadow:var(--shadow);transition:.15s;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}
.btn:active{transform:scale(.96);}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--green));}
.btn.yellow{background:linear-gradient(135deg,var(--yellow),var(--pink));color:#7a5a00;}
.btn.ghost{background:#fff;color:#7A4E86;}
/* home */
.hero{
  background:linear-gradient(135deg,#FFE0EC,#E9E0FF);border-radius:28px;padding:22px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.hero .mascot{width:120px;height:120px;flex:0 0 120px;border-radius:22px;object-fit:contain;background:#fff;box-shadow:0 8px 18px rgba(200,140,180,.22);}
.hero h2{margin:0 0 4px;font-size:26px;color:#7A4E86;}
.hero p{margin:0;color:#8a6e94;font-weight:700;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;}
.stat{flex:1;min-width:130px;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:center;}
.stat .n{font-size:30px;font-weight:900;color:#E0568F;}
.stat .l{font-size:14px;color:#8a7a90;font-weight:700;}
.module-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px;}
.mcard{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:center;border:3px solid var(--cream);transition:.15s;}
.mcard:active{transform:scale(.96);}
.mcard .ic{width:46px;height:46px;margin:0 auto 8px;}
.mcard .nm{font-weight:800;color:#7A4E86;font-size:16px;}
.mcard .ds{font-size:12px;color:#9a8aa0;margin-top:2px;}
/* badge wall */
.badge{background:#fff;border-radius:20px;padding:14px;text-align:center;box-shadow:var(--shadow);border:3px solid var(--cream);}
.badge.earned{border-color:var(--yellow);background:linear-gradient(160deg,#FFFBE8,#FFF0C9);}
.badge .em{width:54px;height:54px;margin:0 auto 6px;}
.badge .nm{font-weight:800;color:#7A4E86;font-size:14px;}
.badge.locked{opacity:.55;filter:grayscale(.6);}
/* dots for counting */
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin:14px auto;}
.dot{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb3cd,#ff6fa0);box-shadow:0 2px 4px rgba(0,0,0,.1);}
/* modal */
#modalRoot{position:fixed;inset:0;background:rgba(90,60,100,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;}
#modalRoot.show{display:flex;}
.modal{background:#fff;border-radius:24px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto;}
.modal h3{margin:0 0 12px;color:#7A4E86;}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
/* writing pad / 描红 */
#pad{width:100%;height:220px;background:var(--cream);border-radius:18px;border:3px dashed var(--pink);touch-action:none;display:block;}
.refbig{font-size:90px;font-weight:900;text-align:center;color:var(--blue);margin:6px 0;line-height:1;}
.trace-tip{font-size:13px;font-weight:800;color:#A98BF5;text-align:center;margin:2px 0 10px;}
/* pinyin detail */
.py-detail{display:flex;gap:14px;flex-wrap:wrap;}
.py-left{flex:1 1 200px;background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);text-align:center;}
.py-big{font-size:84px;font-weight:900;color:var(--purple);line-height:1;text-shadow:0 4px 0 rgba(169,139,245,.18);}
.py-cat{font-size:13px;font-weight:800;color:#A98BF5;margin:4px 0 10px;}
.py-tip{font-size:14px;line-height:1.6;color:#6a5a70;background:#F6F0FF;border-radius:14px;padding:12px;font-weight:600;}
.py-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.py-right{flex:1 1 200px;display:flex;}
.py-scene{flex:1;background:linear-gradient(135deg,#E8F6FF,#FFF3E8);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;}
.py-emoji{font-size:64px;line-height:1;}
.py-scene-t{font-size:15px;font-weight:800;color:#5A4A5E;}
.py-scene-p{font-size:12px;color:#9a8aa0;line-height:1.5;}
.py-section{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-top:16px;}
.py-sec-title{font-size:16px;font-weight:900;color:#7A4E86;margin-bottom:12px;}
.py-tones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.py-tone{font-size:38px;font-weight:900;color:var(--blue);background:#EAF4FF;border-radius:16px;padding:8px 16px;cursor:pointer;transition:.15s;}
.py-tone:active{transform:scale(.92);background:var(--blue);color:#fff;}
.py-rhyme{text-align:center;}
.py-rhyme-t{font-size:17px;font-weight:900;color:#E0568F;margin-bottom:10px;}
.py-rhyme-lines{font-size:16px;line-height:2;color:#5A4A5E;font-weight:700;margin-bottom:12px;}
.py-line{cursor:pointer;border-radius:10px;}
.py-line:active{background:#F6F0FF;}
/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(90,60,100,.92);color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center;}
#toast.show{opacity:1;bottom:110px;}
/* sound btn */
#soundBtn{position:fixed;right:16px;top:14px;z-index:40;width:50px;height:50px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;}
#soundBtn svg{width:26px;height:26px;}
/* bottom tab (mobile) */
#bottomtab{display:none;}
@media(max-width:768px){
  #sidebar{display:none;}
  #content{padding:14px 14px 96px;}
  .topbar{margin-top:48px;}
  #bottomtab{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:45;
    background:#fff;box-shadow:0 -4px 16px rgba(180,140,200,.18);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto;gap:2px;
  }
  .tabbtn{flex:1 0 auto;min-width:62px;border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:#9a8aa0;font-size:11px;font-weight:800;}
  .tabbtn svg{width:26px;height:26px;}
  .tabbtn.active{color:#E0568F;}
  .tabbtn .badge-dot{position:absolute;}
  .grid.c4,.grid.c5,.grid.c6,.grid.c7{grid-template-columns:repeat(3,1fr);}
  .grid.c3{grid-template-columns:repeat(2,1fr);}
  .topbar h1{font-size:20px;}
  .hero h2{font-size:22px;}
}
@media(min-width:769px){#bottomtab{display:none!important;}}

/* ============== 儿童友好增强 ============== */
/* 背景漂浮泡泡 */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
.bub{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),rgba(255,200,230,.30));animation:floaty linear infinite;}
@keyframes floaty{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-34px) translateX(12px)}100%{transform:translateY(0) translateX(0)}}
/* 卡片入场弹跳 */
.lc,.mcard,.badge{animation:popin .42s cubic-bezier(.2,1.3,.5,1) both;}
@keyframes popin{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
/* 卡片悬停漂浮（桌面） */
@media(hover:hover){.lc:hover,.mcard:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 12px 26px rgba(180,140,200,.28);}}
.hero .mascot{animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.mascot .eye{animation:blink 3.2s infinite;transform-origin:center;}
@keyframes blink{0%,48%,52%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
.mascot .hand{animation:wiggle 2.2s ease-in-out infinite;transform-origin:top center;}
.mascot .hand.right{animation-delay:.4s;}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
/* 积分悬浮球 */
#pointsChip{position:fixed;left:14px;top:14px;z-index:41;background:#fff;color:#C9821B;font-weight:900;font-size:16px;
  padding:8px 14px;border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;cursor:pointer;}
#pointsChip:active{transform:scale(.95);}
/* 规则横幅 */
.rule-banner{background:linear-gradient(135deg,#FFF3C9,#FFE0EC);border-radius:18px;padding:12px 16px;font-weight:800;color:#9a6a00;margin:6px 0 16px;box-shadow:var(--shadow);font-size:15px;}
.rule-banner b{color:#E0568F;}
/* 奖励商店 */
.shop-item{background:#fff;border-radius:22px;padding:18px;text-align:center;box-shadow:var(--shadow);border:3px solid var(--cream);display:flex;flex-direction:column;align-items:center;gap:8px;}
.shop-item.can{border-color:var(--green-l);background:linear-gradient(160deg,#fff,#EAFBF1);}
.shop-item .si-emoji{font-size:46px;height:52px;display:flex;align-items:center;justify-content:center;color:#E0568F;}
.shop-item .si-emoji svg{width:46px;height:46px;}
.shop-item .si-name{font-weight:800;color:#7A4E86;font-size:16px;}
.shop-item .si-cost{font-weight:800;color:#C9821B;font-size:15px;}
.shop-man{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-weight:700;color:#5A4A5E;}
.prize-icon-btn{width:42px;height:42px;border-radius:12px;border:2px solid #E9E0FF;background:#fff;color:#7A4E86;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px;}
.prize-icon-btn.on{border-color:#E0568F;background:#FFE0EC;}
.prize-icon-btn svg{width:24px;height:24px;}
/* 庆祝特效层 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden;}
.confetti{position:absolute;top:-40px;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;animation:fall var(--d,2s) cubic-bezier(.3,.1,.3,1) forwards;}
@keyframes fall{0%{transform:translateY(-40px) translateX(0) rotate(0);opacity:1}100%{transform:translateY(106vh) translateX(var(--x,0)) rotate(var(--r,360deg));opacity:.15}}
.pop-text{position:absolute;top:32%;left:50%;transform:translateX(-50%);font-size:62px;font-weight:900;color:#FFC83C;text-shadow:0 5px 0 #E0568F,0 0 18px rgba(255,200,60,.6);animation:pop 1.2s ease forwards;}
@keyframes pop{0%{transform:translateX(-50%) scale(0) rotate(-18deg);opacity:0}30%{transform:translateX(-50%) scale(1.35) rotate(8deg);opacity:1}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:0}}
/* 按钮 hover 微光（桌面） */
@media(hover:hover){.btn:hover{filter:brightness(1.05);transform:translateY(-2px);}}
/* ---------- 启动屏 ---------- */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#FFF6FB 0%,#F1F7FF 50%,#F6F0FF 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;transition:opacity .6s,visibility .6s;}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
#splash .splash-mascot{width:130px;height:130px;border-radius:28px;background:#fff;box-shadow:0 12px 30px rgba(180,140,200,.25);object-fit:contain;padding:8px;}
#splash h1{margin:0;font-size:28px;color:#7A4E86;font-weight:900;}
#splash p{margin:0;font-size:15px;color:#9a7a90;font-weight:700;}
#splash .dots{display:flex;gap:8px;margin-top:6px;}
#splash .dots i{width:10px;height:10px;border-radius:50%;background:#FF7FA9;animation:bounce 1s infinite both;}
#splash .dots i:nth-child(2){background:#4FB8FF;animation-delay:.15s;}
#splash .dots i:nth-child(3){background:#FFC83C;animation-delay:.3s;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(max-width:768px){
  #splash .splash-mascot{width:110px;height:110px;}
  #splash h1{font-size:24px;}
}
.stroke-diagram-wrap{text-align:center;margin:8px 0 12px;}
.stroke-diagram{width:100%;max-width:320px;height:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);}
/* ============== 宠物乐园 ============== */
/* ============== 盲盒收藏册 ============== */
.bb-tabs{display:flex;gap:8px;margin:6px 0 12px}
.bb-tab{flex:1;padding:12px 4px;border:none;border-radius:14px;background:#fff;color:#7A4E86;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(180,140,220,.12);min-height:44px}
.bb-tab.on{background:linear-gradient(135deg,#FF9EC4,#A98BF5);color:#fff}
.bb-card-wrap{perspective:800px;}
.bb-card{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;box-shadow:0 6px 18px rgba(180,140,200,.2);}
.bb-card.flipped{transform:rotateY(180deg);}
.bb-card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;background:#fff;}
.bb-card-back{transform:rotateY(180deg);background:linear-gradient(135deg,#FFE0EC,#E9E0FF);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;}
.bb-card-back .nm{font-size:16px;font-weight:800;color:#7A4E86;margin-bottom:6px;}
.bb-card-back .rarity{font-size:14px;color:#E0568F;margin-bottom:8px;}
.bb-card-back .fact{font-size:13px;color:#5A4A5E;line-height:1.5;font-weight:600;}
.bb-card img{width:100%;height:100%;object-fit:cover;display:block;}
.bb-silhouette{width:100%;height:100%;background:linear-gradient(135deg,#E9E0FF,#F6F0FF);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#BBA6CC;}
.bb-silhouette svg{width:60%;height:auto;opacity:.5;}
.bb-silhouette .lock{font-size:14px;font-weight:800;margin-top:8px;}
.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(min-width:560px){.album-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:860px){.album-grid{grid-template-columns:repeat(6,1fr);}}
.gacha-area{text-align:center;padding:20px;}

<script>
"use strict";
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const s=document.getElementById('splash');if(s)s.classList.add('hide');},1200);});
/* ============== 数据持久化 ============== */
const PREFIX="wb_chenyuqing_";
function load(k,def){try{const v=localStorage.getItem(PREFIX+k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v));}catch(e){}}
const DEFAULT_SHOP=[
  {n:"看一集喜欢的动画片",c:30,i:"tv"},
  {n:"吃一块喜欢的点心",c:40,i:"cookie"},
  {n:"多玩 10 分钟平板",c:50,i:"tablet"},
  {n:"去公园玩一次",c:80,i:"park"},
  {n:"买一个小玩具",c:120,i:"toy"}
];
const SHOP_ICON_KEYS=["gift","tv","cookie","tablet","park","toy","game","star2","book"];
const DEF_PET={growth:0,level:1,fedToday:false,hunger:0,lastFed:"",equipped:{skin:null,costume:null,companions:[]},name:"小彩虹"};
let state={
  stars:load("stars",0),
  counts:load("counts",{pinyin:0,letters:0,poems:0,numbers:0,adventure:0}),
  badges:load("badges",[]),
  sound:load("sound",true),
  today:load("today",{date:"",n:0}),
  adv:load("adv",{level:1,score:0,q:0,done:[]}),
  pin:load("pin","1234"),
  points:load("points",0),
  shop:load("shop",DEFAULT_SHOP),
  pet:load("pet",JSON.parse(JSON.stringify(DEF_PET))),
  checkin:load("checkin",{last:"",streak:0,tickets:0,makeup:0}),
  album:load("album",[]),
  cards:load("cards",[]),
  daily:load("daily",{date:"",earned:0}),
  memo:load("memo",[])
};
let UNICORN_SRC="";
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function addStars(n){
  state.stars+=n;
  const k=todayKey();
  if(state.today.date!==k){state.today={date:k,n:0};}
  state.today.n+=n;
  save("stars",state.stars);save("today",state.today);
  state.pet.growth+=n;save("pet",state.pet);
  checkBadges();refreshStars();
}
function bump(mod){state.counts[mod]=(state.counts[mod]||0)+1;save("counts",state.counts);checkBadges();}
function refreshStars(){document.querySelectorAll(".starnum").forEach(e=>e.textContent=state.stars);}
/* ============== 积分奖励系统 ============== */
const readSet=new Set();
let qMistakes=0, levelMistakes=0;
function startQ(){qMistakes=0;}
function wrongTap(){qMistakes++;}
function addPoints(n){state.points+=n;save("points",state.points);updatePointsUI();}
function updatePointsUI(){document.querySelectorAll(".pointsnum").forEach(e=>e.textContent=state.points);}
/* 每日学习积分上限：普通日≈20、完美日封顶 40（够抽 2 次盲盒）。签到/退款不受限 */
const DAILY_CAP=40;
function earn(n){
  const tk=todayKey();
  if(!state.daily||state.daily.date!==tk)state.daily={date:tk,earned:0};
  const room=Math.max(0,DAILY_CAP-state.daily.earned);
  const give=Math.min(n,room);
  if(give>0){state.daily.earned+=give;save("daily",state.daily);addPoints(give);}
  if(give<n)toast("今天积分攒满啦，明天再来抽盲盒🪙");
  return give;
}
/* 答题奖励：完成得基础分，一次就对(完美)得翻倍分 */
function reward(o){
  const perfect=qMistakes===0;
  const pts=perfect?((o.pPerfect!=null)?o.pPerfect:o.pBase*2):o.pBase;
  addStars(o.stars||1);earn(pts);
  if(o.mod)bump(o.mod);
  playChime(true);celebrate(perfect);
  toast((perfect?"完美！":"很棒！")+" +1★ +"+pts+"分");
}
/* 音效 (WebAudio 合成，不依赖外部) */
let _actx;
function playChime(good){
  if(!state.sound)return;
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==="suspended")_actx.resume();
    const notes=good?[523.25,659.25,783.99,1046.5]:[392,329.63];
    notes.forEach((f,i)=>{
      const o=_actx.createOscillator(),g=_actx.createGain();
      o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(_actx.destination);
      const t=_actx.currentTime+i*0.08;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.start(t);o.stop(t+0.25);
    });
  }catch(e){}
}
/* 庆祝撒花 + 完美弹字 */
function celebrate(perfect){
  const fx=document.getElementById("fx");if(!fx)return;
  const cols=["#FF7FA9","#4FB8FF","#FFC83C","#4FD38A","#A98BF5"];
  const n=perfect?30:14;
  for(let i=0;i<n;i++){
    const p=document.createElement("div");p.className="confetti";
    const star=Math.random()<0.5;
    p.textContent=star?"★":"●";
    p.style.left=(Math.random()*100)+"vw";
    p.style.color=star?"#fff":cols[i%cols.length];
    p.style.background=star?"transparent":cols[i%cols.length];
    p.style.setProperty("--d",(1.4+Math.random()*1.1)+"s");
    p.style.setProperty("--x",((Math.random()*2-1)*140)+"px");
    p.style.setProperty("--r",(Math.random()*720-360)+"deg");
    fx.appendChild(p);setTimeout(()=>p.remove(),2700);
  }
  if(perfect){
    const t=document.createElement("div");t.className="pop-text";t.textContent="完美！";
    fx.appendChild(t);setTimeout(()=>t.remove(),1200);
  }
}

/* ============== 语音 (Web Speech API) ============== */
const CN=["零","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
function speak(text,lang){
  if(!state.sound)return;
  if(!("speechSynthesis"in window)){toast("这个浏览器不能朗读哦");return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||"zh-CN";u.rate=0.82;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}
}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1600);}

function checkBadges(){
  const c=state.counts,earned=state.badges;
  const give=id=>{if(!earned.includes(id)){earned.push(id);toast("🎉 获得新勋章："+BADGES.find(b=>b.id===id).nm);}};
  if(c.pinyin>=5)give("pinyin");
  if(c.letters>=5)give("letters");
  if(c.poems>=8)give("poems");
  if(c.numbers>=10)give("numbers");
  if(state.adv.done.includes(1))give("adventure");
  if(state.stars>=50)give("collector");
  if(BADGES.every(b=>earned.includes(b.id)))give("scholar");
  save("badges",earned);
}

const MODULES=[
 {id:"home",name:"我的乐园",icon:"home"},
 {id:"pinyin",name:"拼音迷宫",icon:"pinyin"},
 {id:"letters",name:"字母乐园",icon:"letters"},
 {id:"poems",name:"古诗花园",icon:"poems"},
 {id:"numbers",name:"数字王国",icon:"numbers"},
 {id:"adventure",name:"闯关冒险",icon:"adventure"},

];
let current="home";
function buildNav(){
  const nav=document.getElementById("nav"),bt=document.getElementById("bottomtab");
  nav.innerHTML="";bt.innerHTML="";
  const act=current==="pinyin-detail"?"pinyin":current;
  MODULES.forEach(m=>{
    const b=document.createElement("button");
    b.className="navbtn"+(m.id===act?" active":"");
    b.innerHTML=ICONS[m.icon]+"<span>"+m.name+"</span>"+(m.id==="home"?'<span class="star">★ '+state.stars+'</span>':"");
    b.onclick=()=>go(m.id);
    nav.appendChild(b);
    const tb=document.createElement("button");
    tb.className="tabbtn"+(m.id===act?" active":"");
    tb.innerHTML=ICONS[m.icon]+"<span>"+m.name+"</span>";
    tb.onclick=()=>go(m.id);
    bt.appendChild(tb);
  });
}
function go(id){current=id;buildNav();render();}

/* ============== 拼音迷宫 ============== */
let pyCat="单韵母";
function renderPinyin(){
  const cats=Object.keys(PINYIN);
  const list=PINYIN[pyCat];
  C.innerHTML=`
  <div class="topbar"><h1>🔤 拼音迷宫</h1>
    <div class="pill" style="margin-left:auto">${ICONS.speak} 点卡片进小课堂</div></div>
  <div class="tabs">${cats.map(c=>`<button class="tab${c===pyCat?" active":""}" onclick="setPyCat('${c}')">${c}</button>`).join("")}</div>
  <div class="grid c5" id="pygrid"></div>
  <div style="margin-top:18px;text-align:center">
    <button class="btn blue" onclick="pyGame()">🎮 听音找拼音（赢星星）</button>
  </div>`;
  const g=document.getElementById("pygrid");
  list.forEach((it,i)=>{
    const el=document.createElement("div");
    el.className="lc "+PIN_CLASS[i%5];
    el.innerHTML=`<div class="big">${it.p}</div><div class="sm">${it.w}</div>
      <div class="acts">
        <button title="读" onclick="event.stopPropagation();speak('${it.c}','zh-CN')">${ICONS.speak}</button>
        <button class="b2" title="写" onclick="event.stopPropagation();openTracing('${it.p}')">${ICONS.pen}</button>
      </div>`;
    el.onclick=()=>openPinyinDetail(it,pyCat);
    g.appendChild(el);
  });
}
let curPy=null;
function openPinyinDetail(it,cat){curPy={it,cat};current="pinyin-detail";buildNav();render();}
function renderPinyinDetail(){
  if(!curPy){return renderPinyin();}
  const {it,cat}=curPy;
  const toneArr=it.tones.split(/\s+/).filter(Boolean);
  C.innerHTML=`
  <div class="topbar"><button class="btn ghost" onclick="go('pinyin')">← 返回</button>
    <h1 style="font-size:19px;margin-left:8px">${cat} · ${it.p}</h1></div>
  <div class="py-detail">
    <div class="py-left">
      <div class="py-big">${it.p}</div>
      <div class="py-cat">${cat}</div>
      <div class="py-tip">🗣️ 发音要领：${it.tip}</div>
      <div class="py-actions">
        <button class="btn blue" onclick="speak('${it.c}','zh-CN')">${ICONS.speak} 读一读</button>
        <button class="btn yellow" onclick="openTracing('${it.p}')">✏️ 写一写</button>
      </div>
    </div>
    <div class="py-right">
      <div class="py-scene">
        <div class="py-emoji">${it.words&&it.words[0]?it.words[0].e:"🌟"}</div>
        <div class="py-scene-t">${it.scene?it.scene.s:""}</div>
        <div class="py-scene-p">${it.scene?it.scene.p:""}</div>
      </div>
    </div>
  </div>
  <div class="py-section">
    <div class="py-sec-title">🎵 四声练习</div>
    <div class="py-tones">${toneArr.map(t=>`<span class="py-tone" onclick="speak('${t}','zh-CN')">${t}</span>`).join("")}</div>
  </div>
  <div class="py-section">
    <div class="py-sec-title">📚 词语认读</div>
    <div class="grid c4" id="wgrid"></div>
  </div>
  <div class="py-section">
    <div class="py-sec-title">🎶 儿歌诵读</div>
    <div class="py-rhyme">
      <div class="py-rhyme-t">《${it.rhyme.t}》</div>
      <div class="py-rhyme-lines">${it.rhyme.lines.map(l=>`<div class="py-line" onclick="speak('${l.replace(/[，。]/g,"")}','zh-CN')">${l}</div>`).join("")}</div>
      <button class="btn yellow" onclick="speakRhyme(${JSON.stringify(it.rhyme.lines)})">${ICONS.speak} 读儿歌</button>
    </div>
  </div>`;
  const wg=document.getElementById("wgrid");
  it.words.forEach((wd,i)=>{
    const el=document.createElement("div");
    el.className="lc "+PIN_CLASS[i%5];
    el.innerHTML=`<div class="big" style="font-size:32px">${wd.e}</div><div class="sm">${wd.w}</div><div class="sm2" style="font-size:11px;color:#9a8aa0">${wd.p}</div>`;
    el.onclick=()=>speak(wd.p,"zh-CN");
    wg.appendChild(el);
  });
}
function speakRhyme(lines){
  let i=0;
  const say=()=>{if(i>=lines.length)return;speak(lines[i],"zh-CN");i++;setTimeout(say,2300);};
  say();
}
function setPyCat(c){pyCat=c;renderPinyin();}
function pyGame(){
  const all=[];Object.values(PINYIN).forEach(a=>a.forEach(x=>all.push(x)));
  const right=all[Math.floor(Math.random()*all.length)];
  const opts=new Set([right]);
  while(opts.size<4)opts.add(all[Math.floor(Math.random()*all.length)]);
  const arr=[...opts].sort(()=>Math.random()-0.5);
  C.innerHTML=`
  <div class="topbar"><h1>🎮 听音找拼音</h1></div>
  <div class="game">
    <div class="qprompt">听一听，是哪个拼音呀？</div>

const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
function renderLetters(){
  C.innerHTML=`
  <div class="topbar"><h1>🔡 字母乐园</h1>
    <div class="pill" style="margin-left:auto">${ICONS.speak} 点字母听发音</div></div>
  <div class="grid c6" id="lgrid"></div>
  <div style="margin-top:18px;text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <button class="btn blue" onclick="letterMatch()">🎮 大小写配对（赢星星）</button>
  </div>`;
  const g=document.getElementById("lgrid");
  LETTERS.forEach(L=>{
    const el=document.createElement("div");
    el.className="lc "+PIN_CLASS[LETTERS.indexOf(L)%5];
    el.innerHTML=`<div class="big">${L}</div><div class="sm">${L.toLowerCase()}</div>`;
    el.onclick=()=>speak(L,"en-US");
    g.appendChild(el);
  });
}
function letterMatch(){
  const L=LETTERS[Math.floor(Math.random()*LETTERS.length)];
  const opts=new Set([L]);
  while(opts.size<4)opts.add(LETTERS[Math.floor(Math.random()*LETTERS.length)]);
  const arr=[...opts].sort(()=>Math.random()-0.5);
  C.innerHTML=`
  <div class="topbar"><h1>🎮 大小写配对</h1></div>
  <div class="game">
    <div class="qprompt">大写字母 <span style="font-size:46px;color:#4FB8FF">${L}</span> 的小写是？</div>

    <div class="opt" id="lopt">
      ${arr.map(o=>`<button data-l="${o}">${o.toLowerCase()}</button>`).join("")}
    </div>
    <div style="margin-top:16px"><button class="btn ghost" onclick="renderLetters()">返回</button></div>
  </div>`;
  let done_l=false;
  document.querySelectorAll("#lopt button").forEach(b=>{
    b.onclick=()=>{
      if(done_l)return;
      if(b.dataset.l===L){done_l=true;b.classList.add("correct");reward({mod:"letters",pBase:3,pPerfect:6});setTimeout(renderLetters,1000);}
      else{b.classList.add("wrong");wrongTap();toast("再试试～");}
    };
  });
}

/* ============== 数字王国 ============== */
let numMode="10以内加减法";
function renderNumbers(){
  const modes=["10以内加减法","20以内加减法"];
  C.innerHTML=`
  <div class="topbar"><h1>🔢 数字王国</h1></div>
  <div class="tabs">${modes.map(m=>`<button class="tab${m===numMode?" active":""}" onclick="setNum('${m}')">${m}</button>`).join("")}</div>
  <div id="numbody"></div>`;
  setNum(numMode);
}
function setNum(m){numMode=m;document.querySelectorAll(".tabs .tab").forEach(t=>t.classList.toggle("active",t.textContent===m));document.getElementById("numbody").innerHTML=numBody(m);bindNum(m);}
function numBody(m){
  if(m==="10以内加减法"||m==="20以内加减法"){return `<div class="game" id="calgame"></div><div style="text-align:center;color:#9a8aa0;font-size:13px;margin-top:8px">${m==="10以内加减法"?"得数不超过 10":"得数不超过 20"}</div>`;}
}
function dots(n){let s="";for(let i=0;i<Math.min(n,20);i++)s+=`<span class="dot"></span>`;return s;}
function bindNum(m){
  if(m==="10以内加减法")return calRound(10);
  if(m==="20以内加减法")return calRound(20);
}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function calRound(max){
  startQ();
  const add=Math.random()<0.5;
  let a,b,ans,sign;
  if(max===10){
    if(add){a=rnd(1,9);b=rnd(1,10-a);ans=a+b;sign="+";}
    else{a=rnd(2,10);b=rnd(1,a);ans=a-b;sign="-";}
  }else{
    if(add){a=rnd(1,19);b=rnd(1,20-a);ans=a+b;sign="+";}
    else{a=rnd(2,20);b=rnd(1,a);ans=a-b;sign="-";}
  }
  const opts=new Set([ans]);
  while(opts.size<4){
    let d=ans+rnd(-5,5);
    if(d<0)d=Math.abs(d);
    if(d>max)d=max-Math.abs(rnd(0,3));
    opts.add(d);
  }
  const arr=[...opts].sort(()=>Math.random()-0.5);
  document.getElementById("calgame").innerHTML=`
    <div class="qprompt">算一算： <span style="font-size:40px;color:#4FB8FF">${a} ${sign} ${b} = ?</span></div>
    <div class="opt" id="calopt">${arr.map(o=>`<button data-v="${o}">${o}</button>`).join("")}</div>
    <div style="margin-top:14px"><button class="btn ghost" onclick="renderNumbers()">返回</button></div>`;
  document.querySelectorAll("#calopt button").forEach(b=>b.onclick=()=>{
    if(b.dataset.done)return;b.dataset.done="1";
    if(+b.dataset.v===ans){b.classList.add("correct");reward({mod:"numbers",pBase:3,pPerfect:6});setTimeout(()=>setNum(numMode),1000);}
    else{b.classList.add("wrong");wrongTap();toast("再算算～");b.dataset.done="";}
  });
}

function renderAdventure(){
  const a=state.adv;
  if(!a.active){
    C.innerHTML=`
    <div class="topbar"><h1>🚩 闯关冒险</h1></div>
    <div class="hero" style="margin-bottom:16px">
      <div>
        <h2>第 ${a.level} 关</h2>
        <p>综合 5 道小题，全部闯过拿星星和勋章！</p>
      </div>
      <div style="margin-left:auto" class="pill">已通关 ${a.done.length} 关</div>
    </div>
    <div style="text-align:center">
      <button class="btn" style="font-size:22px;padding:18px 40px" onclick="startAdv()">开始闯关 ▶</button>
    </div>
    <div class="module-title" style="margin-top:24px">${ICONS.star} 勋章墙</div>
    <div class="grid c4" id="badgewall"></div>`;
    renderBadges();
    return;
  }
  advRound();
}
function renderBadges(){
  const w=document.getElementById("badgewall");if(!w)return;
  w.innerHTML=BADGES.map(b=>{
    const got=state.badges.includes(b.id);
    return `<div class="badge ${got?"earned":"locked"}">
      <div class="em"><svg viewBox="0 0 24 24" fill="${got?"#FFC83C":"#cfc4d6"}"><path d="${b.ic}"/></svg></div>
      <div class="nm">${b.nm}</div>
      <div style="font-size:11px;color:#9a8aa0;margin-top:2px">${got?"已获得":"🔒 "+b.need}</div>
    </div>`;
  }).join("");
}
function startAdv(){
  state.adv.active=true;state.adv.q=0;state.adv.score=0;state.adv.round=buildRound();levelMistakes=0;save("adv",state.adv);renderAdventure();
}
function buildRound(){
  // 5 道混合题
  const qTypes=["py","letter","cal"];
  return qTypes.map(t=>{
    if(t==="py"){const all=[];Object.values(PINYIN).forEach(a=>a.forEach(x=>all.push(x)));const r=all[Math.floor(Math.random()*all.length)];const opts=new Set([r]);while(opts.size<4)opts.add(all[Math.floor(Math.random()*all.length)]);return{type:"py",right:r,opts:[...opts].sort(()=>Math.random()-.5)};}
    if(t==="letter"){const L=LETTERS[Math.floor(Math.random()*LETTERS.length)];const opts=new Set([L]);while(opts.size<4)opts.add(LETTERS[Math.floor(Math.random()*LETTERS.length)]);return{type:"letter",right:L,opts:[...opts].sort(()=>Math.random()-.5)};}
    if(t==="cal"){const add=Math.random()<.5;let a,b,ans,sign;if(add){a=rnd(1,9);b=rnd(1,10-a);ans=a+b;sign="+";}else{a=rnd(2,10);b=rnd(1,a);ans=a-b;sign="-";}const opts=new Set([ans]);while(opts.size<4)opts.add(Math.max(0,ans+rnd(-3,3)));return{type:"cal",a,b,sign,ans,opts:[...opts].sort(()=>Math.random()-.5)};}
  });
}
function advRound(){
  const a=state.adv;const r=a.round[a.q];const total=a.round.length;
  let html=`<div class="topbar"><h1>🚩 第 ${a.level} 关 · 第 ${a.q+1}/${total} 题</h1></div><div class="game" id="advbody"></div>`;
  C.innerHTML=html;startQ();
  const body=document.getElementById("advbody");
  if(r.type==="py"){
    body.innerHTML=`<div class="qprompt">听音，选拼音</div><button class="btn yellow" onclick="speak('${r.right.c}','zh-CN')">${ICONS.speak} 听一听</button>
      <div class="opt" id="ao">${r.opts.map(o=>`<button data-p="${o.p}">${o.p}</button>`).join("")}</div>`;
    bindAdv("#ao",b=>b.dataset.p===r.right.p);
  }else if(r.type==="letter"){
    body.innerHTML=`<div class="qprompt">大写 <span style="font-size:40px;color:#4FB8FF">${r.right}</span> 的小写？</div><button class="btn yellow" onclick="speak('${r.right}','en-US')">${ICONS.speak} 听发音</button>
      <div class="opt" id="ao">${r.opts.map(o=>`<button data-p="${o.toLowerCase()}">${o.toLowerCase()}</button>`).join("")}</div>`;
    bindAdv("#ao",b=>b.dataset.p===r.right.toLowerCase());
  }else if(r.type==="cal"){
    body.innerHTML=`<div class="qprompt">${r.a} ${r.sign} ${r.b} = ?</div>
      <div class="opt" id="ao">${r.opts.map(o=>`<button data-p="${o}">${o}</button>`).join("")}</div>`;
    bindAdv("#ao",b=>+b.dataset.p===r.ans);
  }
}
function bindAdv(sel,check){
  let done=false;
  document.querySelectorAll(sel+" button").forEach(b=>{
    b.onclick=()=>{
      if(done)return;done=true;
      if(check(b)){b.classList.add("correct");reward({stars:1,pBase:3,pPerfect:6,mod:null});}
      else{b.classList.add("wrong");wrongTap();levelMistakes++;playChime(false);toast("下次会更好～");}
      state.adv.q++;save("adv",state.adv);
      setTimeout(()=>{if(state.adv.q>=state.adv.round.length)finishAdv();else renderAdventure();},850);
    };
  });
}
function finishAdv(){
  const a=state.adv;
  if(!a.done.includes(a.level))a.done.push(a.level);
  const perfect=levelMistakes===0;
  earn(perfect?12:6);
  a.level++;a.active=false;save("adv",a);
  bump("adventure");checkBadges();
  celebrate(perfect);
  showModal(`
    <h3>🎉 第 ${a.level-1} 关 通关啦！</h3>
    <div style="text-align:center;font-size:60px">🏅⭐${perfect?"✨":""}</div>
    <p style="text-align:center;font-weight:700">${perfect?"全对！完美通关，额外 <b>+12 分</b>！":"通关成功，+6 分！"}<br>勋章墙又多一枚～</p>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="closeModal();renderAdventure()">继续冒险</button>
    </div>`);
}

let bbTab="draw";
function ymdToDate(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function daysBetween(a,b){return Math.round((ymdToDate(b)-ymdToDate(a))/86400000);}
function addDays(s,n){const d=ymdToDate(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function renderShop(){
  const tk=todayKey();
  const signedToday=state.checkin.last===tk;
  const streak=state.checkin.streak||0;
  C.innerHTML=`
  <div class="topbar"><h1>🎁 我的盲盒收藏册</h1>
    <div class="pill" style="margin-left:auto">🔥 连击 <b>${streak}</b></div></div>
  <div class="bb-tabs">
    <button class="bb-tab ${bbTab==='draw'?'on':''}" onclick="bbTab='draw';renderShop()">🎲 抽盲盒</button>
    <button class="bb-tab ${bbTab==='album'?'on':''}" onclick="bbTab='album';renderShop()">📖 图鉴</button>
    <button class="bb-tab ${bbTab==='sign'?'on':''}" onclick="bbTab='sign';renderShop()">📅 签到</button>
  </div>
  ${bbTab==='draw'?renderDrawHTML():bbTab==='album'?renderAlbumPageHTML():renderSignHTML2(signedToday,streak)}
  `;
}
function renderSignHTML2(signed,streak){
  const tk=todayKey();
  const gap = state.checkin.last ? daysBetween(state.checkin.last,tk) : 99;
  let extra="";
  if(!signed && gap>1 && (state.checkin.makeup||0)>0){
    extra=`<button class="btn ghost" onclick="useMakeup()">🛠️ 用补签卡补签（剩 ${state.checkin.makeup} 张）</button>`;
  }
  return `<div class="card sign-card2">
    <div class="flame2 ${signed?'lit':'off'}">🔥</div>
    <div class="sign-streak">连续签到 <b>${streak}</b> 天</div>
    <div class="sign-tip">每天都要来签到哦，断了火焰会熄灭🔥<br>签到 +5 积分，满 7 天额外 +15 积分，满 30 天额外 +50 积分！</div>
    ${signed?`<div class="sign-done">今天已签到 ✓ 明天再来吧</div>`:`<button class="btn yellow big" onclick="signToday2()">✨ 今日签到领积分</button>`}
    ${extra}
    ${(state.checkin.makeup||0)>0?`<div class="makeup">你有补签卡 ${state.checkin.makeup} 张</div>`:''}
  </div>`;
}
function renderDrawHTML(){
  const have=state.cards||[];
  const pool=CARDS.filter(c=>c.ready);
  const can=state.points>=20 && pool.length>0;
  return `<div class="card gacha-area">
    <div class="gacha-tip-big">🪙 你有 <b>${state.points}</b> 积分</div>
    <div class="gacha-sub">20 积分抽一次水果女孩收藏卡<br>完美日大约能抽 2 次，重复卡片返还 5 积分</div>
    <div class="gacha-box" id="gb">🎁</div>
    <button class="btn yellow big" ${can?'':'disabled style="opacity:.5"'} onclick="drawCard()">${can?(pool.length?'🎁 抽一次盲盒':'卡片还没准备好'):'积分不够，去学习吧'}</button>
    <div class="bb-progress">已收集 ${have.length}/${CARDS.length} 张 · 卡池已有 ${pool.length} 张</div>
  </div>`;
}
function renderAlbumPageHTML(){
  const have=new Set(state.cards||[]);
  return `<div class="card">
    <div class="bb-progress">点击卡片翻面看小知识</div>
    <div class="album-grid" id="albumGrid2">
      ${CARDS.map((c,i)=>renderAlbumCard(c,i,have.has(i))).join('')}
    </div>
  </div>`;
}
function renderAlbumCard(c,i,got){
  const rar='★'.repeat(c.rarity);
  const front=got?`<img src="${c.img}" alt="${c.name}" loading="lazy">`:silhouetteHTML();
  return `<div class="bb-card-wrap" onclick="flipCard(${i})">
    <div class="bb-card ${got?'got':''}" id="bc-${i}">

function flipCard(i){const el=document.getElementById('bc-'+i);if(!el)return;el.classList.toggle('flipped');}
function signToday2(){
  const tk=todayKey();
  if(state.checkin.last===tk){toast("今天已经签到啦");return;}
  const yest=addDays(tk,-1);
  if(state.checkin.last===yest)state.checkin.streak++; else state.checkin.streak=1;
  state.checkin.last=tk;
  let bonus=0;
  if(state.checkin.streak%7===0)bonus=15;
  if(state.checkin.streak%30===0)bonus=50;
  const total=5+bonus;
  addPoints(total);
  save("checkin",state.checkin);
  playChime(true);celebrate(true);
  toast("签到成功！连击 "+state.checkin.streak+" 天 🪙+"+total);
  renderShop();
}
function useMakeup(){
  if((state.checkin.makeup||0)<1){toast("没有补签卡");return;}
  state.checkin.makeup--;
  state.checkin.last=addDays(todayKey(),-1);
  save("checkin",state.checkin);
  toast("已补签，明天签到连击不断🔥");
  renderShop();
}
function drawCard(){
  if(state.points<20){toast("积分不够，去做题赚分吧🪙");return;}
  const pool=CARDS.map((c,i)=>c.ready?i:null).filter(x=>x!==null);
  if(pool.length===0){toast("卡片还没准备好，稍后再来");return;}
  state.points-=20; save("points",state.points); updatePointsUI();
  showModal(`<div class="gacha-pop"><div class="gacha-box" id="gb">🎁</div><div class="gacha-tip">正在打开盲盒…</div></div>`);
  document.getElementById("gb").classList.add("shake");
  setTimeout(()=>revealCard(pool),900);
}
function revealCard(pool){
  const idx=pool[Math.floor(Math.random()*pool.length)];
  const c=CARDS[idx];
  const had=new Set(state.cards||[]);
  const isNew=!had.has(idx);
  if(isNew){state.cards.push(idx); save("cards",state.cards);}
  else{state.points+=5; save("points",state.points); updatePointsUI();}
  playChime(true);celebrate(true);
  showModal(`<div class="gacha-pop"><div class="gacha-card-reveal"><img src="${c.img}" alt="${c.name}"></div>
    <div class="gr-title">${c.name}</div>
    <div class="gr-sub"><span class="rarity-stars">${'★'.repeat(c.rarity)}</span></div>
    ${isNew?'<div class="gr-new">✨ 新收集！</div>':'<div class="dup">重复卡片 · 返还 5 积分</div>'}
    <div style="margin:8px 0;font-size:13px;color:#7A4E86;font-weight:600">${c.fact}</div>
    <button class="btn yellow" onclick="closeModal();renderShop()">收下啦</button>
  </div>`);
}
function showSignModal(){
  if(state.checkin.last===todayKey())return;
  showModal(`<div class="sign-modal"><div class="flame lit">🔥</div><div style="font-size:20px;font-weight:800">今天还没签到哦！</div><div style="color:#7A4E86;margin:6px 0">签到 +5 积分，连续签到火焰不灭🔥</div><button class="btn yellow big" onclick="signToday2();closeModal()">✨ 今日签到</button></div>`);

function maybePromptSign(){if(state.checkin.last!==todayKey() && !sessionStorage.getItem("cyq_signed")){sessionStorage.setItem("cyq_signed","1");setTimeout(showSignModal,500);}}
/* ============== 备忘录 ============== */
function renderMemo(){
  const list=(state.memo||[]).slice().sort((a,b)=>b.t-a.t);
  C.innerHTML=`
  <div class="topbar"><h1>📝 小备忘录</h1>
    <div class="pill" style="margin-left:auto">已记 ${list.length} 条</div></div>
  <div class="card memo-add">
    <textarea id="memoInput" placeholder="记点什么吧～（例如：想学的字、想画的水果、周末想去哪）" rows="3" style="width:100%;border:none;border-radius:14px;padding:12px;font-size:15px;font-family:inherit;resize:none;box-shadow:0 2px 8px rgba(180,140,220,.12)"></textarea>
    <button class="btn yellow big" style="margin-top:10px;width:100%" onclick="addMemo()">➕ 加一条</button>
  </div>
  <div class="memo-list">
    ${list.length?list.map(m=>memoItemHTML(m)).join(''):'<div class="memo-empty">还没有备忘哦，写一条试试～</div>'}
  </div>`;
  const ta=document.getElementById('memoInput');
  if(ta)ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addMemo();});
}
function memoItemHTML(m){
  const d=new Date(m.t);
  const ts=(d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return `<div class="memo-item ${m.done?'done':''}">
    <button class="memo-check" onclick="toggleMemo(${m.id})">${m.done?'✅':'⚪'}</button>
    <div class="memo-text">${escapeHTML(m.text)}</div>
    <div class="memo-meta">${ts}</div>
    <button class="memo-del" onclick="delMemo(${m.id})" title="删除">🗑</button>
  </div>`;
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function addMemo(){
  const ta=document.getElementById('memoInput');
  const t=(ta.value||'').trim();
  if(!t){toast('写点内容再添加哦');return;}
  state.memo=state.memo||[];
  state.memo.push({id:Date.now(),text:t,t:Date.now(),done:false});
  save('memo',state.memo);
  renderMemo();
  toast('记下啦 📝');
}
function toggleMemo(id){
  state.memo=(state.memo||[]).map(m=>m.id===id?{...m,done:!m.done}:m);
  save('memo',state.memo);
  renderMemo();
}
function delMemo(id){
  state.memo=(state.memo||[]).filter(m=>m.id!==id);
  save('memo',state.memo);
  renderMemo();
}

/* ============== 写字板：上方笔顺大图 + 下方描红 ============== */
function strokeTip(ch){return (STROKE_TIPS[ch]||{guide:"跟着笔顺描一描",nums:[]});}
function renderStrokeDiagram(ch){
  const tip=strokeTip(ch);
  const nums=tip.nums;
  let circles=nums.map(([x,y],i)=>{
    const n=i+1;
    return `<circle cx="${x}" cy="${y}" r="14" fill="#fff" stroke="#A98BF5" stroke-width="2.5"/><text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="#7A4E86" font-size="15" font-weight="bold">${n}</text>`;
  }).join("");
  // 上二线、基线虚线
  const lines=`<line x1="10" y1="34" x2="190" y2="34" stroke="#E0D6F0" stroke-width="1.5" stroke-dasharray="6,6"/><line x1="10" y1="92" x2="190" y2="92" stroke="#E0D6F0" stroke-width="1.5" stroke-dasharray="6,6"/>`;
  return `<svg class="stroke-diagram" viewBox="0 0 200 120">${lines}<text x="100" y="86" text-anchor="middle" font-size="82" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="#C8B8E8" font-weight="600">${ch}</text>${circles}</svg>`;
}
let padCtx=null,padDrawing=false,padTxt="";
function openTracing(txt){
  padTxt=txt.length===1?txt:txt[0];
  const tip=strokeTip(padTxt);
  showModal(`
    <h3>✏️ 描红写一写：${padTxt}</h3>
    <div class="trace-tip">${tip.guide}</div>
    <div class="stroke-diagram-wrap">${renderStrokeDiagram(padTxt)}</div>
    <canvas id="pad"></canvas>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="clearPad()">清除</button>
      <button class="btn ghost" onclick="closeModal()">完成</button>
    </div>`);
  initPad(padTxt);
}
function initPad(ch){
  const cv=document.getElementById("pad");if(!cv)return;
  const rect=cv.getBoundingClientRect();
  const w=Math.max(260,rect.width||320),h=200;
  cv.width=w*2;cv.height=h*2;
  const ctx=cv.getContext("2d");ctx.setTransform(2,0,0,2,0,0);
  padCtx=ctx;
  drawPadGray(ch);
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const start=e=>{e.preventDefault();cancelAnim();padDrawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const move=e=>{if(!padDrawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const end=()=>{padDrawing=false;};
  cv.addEventListener("mousedown",start);cv.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  cv.addEventListener("touchstart",start,{passive:false});cv.addEventListener("touchmove",move,{passive:false});cv.addEventListener("touchend",end);
}
function drawPadGray(ch){
  const ctx=padCtx;const cv=document.getElementById("pad");if(!ctx||!cv)return;
  const w=cv.width/2,h=cv.height/2;
  ctx.clearRect(0,0,w,h);
  // 虚线格
  ctx.save();ctx.strokeStyle="#E0D6F0";ctx.lineWidth=1.5;ctx.setLineDash([6,6]);
  const topY=h*0.30,baseY=h*0.78;
  ctx.beginPath();ctx.moveTo(0,topY);ctx.lineTo(w,topY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,baseY);ctx.lineTo(w,baseY);ctx.stroke();
  ctx.restore();
  // 灰色大字描红
  ctx.save();
  ctx.fillStyle="#E7DEFB";
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.font=`600 ${Math.min(w,h)*0.78}px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText(ch,w/2,baseY+4);
  ctx.restore();
}
function cancelAnim(){}
function clearPad(){if(!padCtx)return;drawPadGray(padTxt);}

function openSettings(){
  showModal(`
    <h3>${ICONS.gear} 家长设置</h3>

function verifyPin(){
  const v=document.getElementById("pinin").value;

  showModal(`
    <h3>${ICONS.gear} 家长设置</h3>

      <button class="btn blue" onclick="exportData()">${ICONS.star} 导出备份 (JSON)</button>

      <button class="btn yellow" onclick="changePin()">修改家长密码</button>

      <button class="btn ghost" onclick="closeModal()">关闭</button>

}
function exportData(){
  const data={stars:state.stars,counts:state.counts,badges:state.badges,adv:state.adv,today:state.today,points:state.points,shop:state.shop,pet:state.pet,checkin:state.checkin,album:state.album,cards:state.cards,daily:state.daily,memo:state.memo};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="chenyuqing-backup.json";a.click();
  toast("已导出备份");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);
      if(typeof d.stars==="number")state.stars=d.stars;
      if(d.counts)state.counts=Object.assign(state.counts,d.counts);
      if(Array.isArray(d.badges))state.badges=d.badges;
      if(d.adv)state.adv=d.adv;
      if(d.today)state.today=d.today;
      if(typeof d.points==="number")state.points=d.points;
      if(Array.isArray(d.shop))state.shop=d.shop;
      if(d.pet)state.pet=d.pet;
      if(d.checkin)state.checkin=d.checkin;
      if(Array.isArray(d.album))state.album=d.album;
      if(Array.isArray(d.cards))state.cards=d.cards;
      if(Array.isArray(d.memo))state.memo=d.memo;
      if(d.daily)state.daily=d.daily;
      save("stars",state.stars);save("counts",state.counts);save("badges",state.badges);save("adv",state.adv);save("today",state.today);save("points",state.points);save("shop",state.shop);save("pet",state.pet);save("checkin",state.checkin);save("album",state.album);save("cards",state.cards);save("daily",state.daily);save("memo",state.memo);
      refreshStars();updatePointsUI();buildNav();toast("恢复成功！");closeModal();render();
    }catch(err){toast("文件格式不对");}
  };
  r.readAsText(f);
}
function changePin(){
  const n=prompt("设置新的 4 位数字密码：");
  if(n&&/^\d{4}$/.test(n)){state.pin=n;save("pin",n);toast("密码已修改");closeModal();}
  else if(n!==null)toast("请输入 4 位数字");
}
function clearAll(){

  localStorage.removeItem(PREFIX+"stars");localStorage.removeItem(PREFIX+"counts");localStorage.removeItem(PREFIX+"badges");

  state={stars:0,counts:{pinyin:0,letters:0,poems:0,numbers:0,adventure:0},badges:[],sound:state.sound,today:{date:"",n:0},adv:{level:1,score:0,q:0,done:[]},pin:state.pin,points:0,shop:DEFAULT_SHOP,pet:JSON.parse(JSON.stringify(DEF_PET)),checkin:{last:"",streak:0,tickets:0,makeup:0},album:[],cards:[],memo:[]};

}
